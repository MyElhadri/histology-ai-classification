# InceptionV3 Experiment A Configuration — Fair Comparison with DenseNet121 Exp D
# Protocol Specifications:
# - 432 images originales (432 original images)
# - 22 classes (class_mapping.json)
# - seed 42
# - input 224 x 224 x 3
# - ImageNet weights
# - same folds as DenseNet121 Exp D (data/manifests/densenet121_folds.csv)
# - screening folds: 0, 3, 4
# - rich online augmentation train only
# - original images only for validation
# - no TTA (no test-time augmentation)
# - article_inspired classification head
# - per-fold balanced class weights
# - 2 training phases (head training then full fine-tuning with frozen backbone BN)
#
# Preprocessing Note:
# Images enter pipeline as float32 in [0, 255].
# InceptionV3 model applies internal Rescaling(scale=1.0/127.5, offset=-1.0)
# to map pixel values to [-1, 1]. No external divide by 255.

experiment_name: inceptionv3-exp-a-fair-comparison

experiment:
  name: inceptionv3-exp-a-fair-comparison
  seed: 42

project:
  name: histology-ai-classification
  seed: 42

data:
  dataset_root: data/raw/nuinsseg_human_22_original
  manifest_path: data/manifests/original_22_dataset_manifest.csv
  folds_path: data/manifests/densenet121_folds.csv
  image_size: [224, 224]
  num_channels: 3
  num_classes: 22

preprocessing:
  input_dtype: float32
  input_range: [0, 255]
  model_output_range: [-1, 1]
  method: inceptionv3_rescaling
  external_divide_by_255: false
  external_preprocess_input: false

validation:
  strategy: stratified_k_fold
  num_folds: 5
  folds_path: data/manifests/densenet121_folds.csv
  original_images_only: true
  tta: false

screening:
  folds: [0, 3, 4]

model:
  architecture: InceptionV3
  weights: imagenet
  include_top: false
  input_shape: [224, 224, 3]
  num_classes: 22
  dropout_rate: 0.30
  classifier_head:
    type: article_inspired
    pooling: global_average
    dense_1_units: 512
    dense_1_activation: elu
    batch_normalization: true
    dropout_rate: 0.30
    dense_2_units: 128
    dense_2_activation: elu
    l2_strength: 0.01
    output_activation: softmax

training:
  environment: google_colab
  batch_size: 16
  head_epochs: 10
  fine_tuning_epochs: 40
  head_learning_rate: 0.001
  fine_tuning_learning_rate: 0.00001
  use_class_weights: true
  class_weight_method: balanced

augmentation:
  enabled: true
  policy: rich
  horizontal_flip: true
  vertical_flip: true
  rotation_factor: 0.04
  zoom_factor: 0.10
  brightness_delta: 0.05
  contrast_factor: 0.10
  saturation_lower: 0.90
  saturation_upper: 1.10
  gaussian_noise_stddev: 0.01
  clip_min: 0.0
  clip_max: 255.0

fine_tuning:
  strategy: full
  keep_batch_normalization_frozen: true

callbacks:
  monitor: val_ce_hard
  mode: min
  early_stopping_patience: 5
  min_delta: 0.002
  restore_best_weights: true
  start_from_epoch: 5
  reduce_lr_patience: 2
  reduce_lr_factor: 0.2
  min_learning_rate: 0.0000001
