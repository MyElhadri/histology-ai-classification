# InceptionResNetV2 Expérience A — High Performance Histology
# ============================================================
#
# Protocole scientifique :
# - 432 images originales, 22 classes
# - Seed 42
# - Résolution 299 × 299 × 3 (native InceptionResNetV2)
# - Poids ImageNet
# - Mêmes folds que DenseNet121 Exp D (data/manifests/densenet121_folds.csv)
# - Folds de screening : 3, puis 0, puis 4
# - Augmentation riche en ligne (train uniquement)
# - Images originales uniquement en validation (pas TTA)
# - Tête article_inspired identique à DenseNet121 Exp D
# - Class weights balancés par fold
# - 3 phases d'entraînement : tête → dégel partiel 30% → dégel complet
#
# Preprocessing (STRICT) :
# - Le pipeline externe fournit : float32, valeurs dans [0, 255]
# - Le modèle applique en interne : Rescaling(scale=1.0/127.5, offset=-1.0) → [-1, 1]
# - Aucune division par 255 externe
# - Aucun preprocess_input externe
# - Aucune double normalisation
#
# Différences intentionnelles vs DenseNet121 Exp D :
# - Architecture : InceptionResNetV2 (connexions résiduelles dans blocs Inception)
# - Résolution : 299 × 299 (vs 224 × 224)
# - Preprocessing : [-1, 1] via Rescaling interne (vs densenet.preprocess_input)
# - Batch size : 8 (vs 16, adapté GPU Colab)
# - Entraînement en 3 phases (vs 2)
# - Dégel partiel (30%) en phase 2 avant dégel complet en phase 3

experiment:
  name: inception-resnet-v2-exp-a-high-performance
  seed: 42

project:
  name: histology-ai-classification
  seed: 42

data:
  dataset_root: data/raw/nuinsseg_human_22_original
  manifest_path: data/manifests/original_22_dataset_manifest.csv
  folds_path: data/manifests/densenet121_folds.csv
  image_size: [299, 299]
  num_channels: 3
  num_classes: 22

preprocessing:
  # Contract: external pipeline → float32, [0, 255]
  # Internal model applies Rescaling(1/127.5, -1.0) → [-1, 1]
  input_dtype: float32
  input_range: [0, 255]
  output_range: [-1, 1]
  method: internal_rescaling
  layer_name: inception_resnet_v2_preprocessing
  scale: 0.00784313725490196   # = 1.0/127.5
  offset: -1.0
  external_divide_by_255: false
  external_preprocess_input: false

validation:
  strategy: stratified_5_fold
  num_folds: 5
  manifest: data/manifests/densenet121_folds.csv
  original_images_only: true
  tta: false

screening:
  folds: [3, 0, 4]
  expected_samples:
    fold_3: 86
    fold_0: 87
    fold_4: 86
    total: 259

model:
  architecture: InceptionResNetV2
  weights: imagenet
  include_top: false
  input_shape: [299, 299, 3]
  num_classes: 22
  dropout_rate: 0.30
  # Tête identique à DenseNet121 Exp D (article_inspired)
  head: article_inspired
  classifier_head:
    type: article_inspired
    pooling: global_average
    dense_1_units: 512
    dense_1_activation: elu
    batch_normalization: true
    dropout_rate: 0.30
    dense_2_units: 128
    dense_2_activation: elu
    l2_strength: 0.01
    output_activation: softmax

training:
  environment: google_colab
  batch_size: 8
  mixed_precision: true
  use_class_weights: true
  class_weight_method: balanced

  phase_1:
    name: head_training
    backbone_trainable: false
    epochs: 10
    learning_rate: 3.0e-4

  phase_2:
    name: partial_fine_tuning
    trainable_backbone_fraction: 0.30
    freeze_batch_normalization: true
    epochs: 30
    learning_rate: 1.0e-5

  phase_3:
    name: full_fine_tuning
    enabled: true
    freeze_batch_normalization: true
    epochs: 15
    learning_rate: 3.0e-6

# Augmentation identique à DenseNet121 Exp D — Richesse Validée
augmentation:
  enabled: true
  policy: rich
  horizontal_flip: true
  vertical_flip: true
  rotation_factor: 0.04
  zoom_factor: 0.10
  brightness_delta: 0.05
  contrast_factor: 0.10
  saturation_lower: 0.90
  saturation_upper: 1.10
  gaussian_noise_stddev: 0.01
  clip_min: 0.0
  clip_max: 255.0

# Stratégie de fine-tuning — 3 phases
fine_tuning:
  strategy: three_phase
  phase_2_trainable_fraction: 0.30
  freeze_batch_normalization: true
  keep_batch_normalization_frozen: true

# Callbacks identiques à InceptionV3 Exp A (issus de DenseNet Exp D)
callbacks:
  monitor: val_ce_hard
  mode: min
  early_stopping_patience: 5
  min_delta: 0.002
  restore_best_weights: true
  start_from_epoch: 5
  reduce_lr_patience: 2
  reduce_lr_factor: 0.2
  min_learning_rate: 0.0000001

# Sélection du meilleur checkpoint par fold
checkpoint_selection:
  primary_metric: val_full_macro_f1
  secondary_metric: val_full_accuracy
  tertiary_metric: val_full_cross_entropy
  primary_mode: max
  secondary_mode: max
  tertiary_mode: min

# Références scientifiques (affichage uniquement — ne pas utiliser pour modifier les prédictions)
references:
  baseline_historical:
    accuracy: 0.8449
    macro_f1: 0.7728
    weighted_f1: 0.8403
    note: "Baseline historique toutes expériences DenseNet"
  densenet121_exp_d_oof_complet:
    accuracy: 0.8843
    macro_f1: 0.8280
    weighted_f1: 0.8794
    note: "DenseNet121 Exp D OOF complet (432 images, 5 folds)"
  densenet121_exp_d_screening_folds_0_3_4:
    mean_accuracy: 0.8610
    mean_macro_f1: 0.7889
    mean_weighted_f1: 0.8538
    note: "DenseNet121 Exp D folds de screening (0, 3, 4) uniquement"

# Critères de qualification du screening
screening_criteria:
  individual_minimum:
    mean_accuracy: 0.84
    mean_macro_f1: 0.76
    mean_weighted_f1: 0.83
  strong:
    global_accuracy: 0.87
    global_macro_f1: 0.81
    global_weighted_f1: 0.86
  complementarity:
    ensemble_macro_f1_beats_densenet: true
    ensemble_accuracy_not_lower_than_densenet: true
  # NE PAS lancer automatiquement les folds 1 et 2
  auto_proceed_to_full_training: false
